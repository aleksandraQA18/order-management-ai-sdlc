name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [products-api]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --tag ghcr.io/aleksandraqa18/${{ matrix.service }}:${{ github.sha }} \
            --tag ghcr.io/aleksandraqa18/${{ matrix.service }}:latest \
            ./backend

      - name: Push image
        run: docker push ghcr.io/aleksandraqa18/${{ matrix.service }} --all-tags
