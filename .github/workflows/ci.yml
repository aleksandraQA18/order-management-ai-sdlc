name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: order_user
          POSTGRES_PASSWORD: order_password
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U order_user -d orders"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run lint
        run: ruff check backend tests

      - name: Check formatting
        run: ruff format --check backend tests

      - name: Check database connection
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: orders
          DB_USER: order_user
          DB_PASSWORD: order_password
        run: |
          python -c "import psycopg; conn = psycopg.connect(host='$DB_HOST', port='$DB_PORT', dbname='$DB_NAME', user='$DB_USER', password='$DB_PASSWORD'); conn.close(); print('Database connection OK')"
      - name: Run migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: orders
          DB_USER: order_user
          DB_PASSWORD: order_password
        run: alembic upgrade head

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: orders
          DB_USER: order_user
          DB_PASSWORD: order_password
        run: pytest -v

  staging-build:
    runs-on: ubuntu-latest
    needs: test

    env:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: orders
      DB_USER: order_user
      DB_PASSWORD: order_password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build staging
        run: docker compose -f compose.staging.yml build

      - name: Start staging
        run: docker compose -f compose.staging.yml up -d

      - name: Check containers
        run: docker compose -f compose.staging.yml ps

      - name: Show staging logs
        run: docker compose -f compose.staging.yml logs

      - name: Show staging logs
        run: docker compose -f compose.staging.yml logs order-api

      - name: Smoke test API
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8001; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Stop staging
        if: always()
        run: docker compose -f compose.staging.yml down -v
